<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join a Room</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: linear-gradient(135deg, #1e1e2f, #27293d);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.05);
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      max-width: 400px;
      width: 90%;
    }

    h1 {
      font-size: 2.2em;
      margin-bottom: 24px;
      color: #00bcd4;
    }

    input {
      padding: 12px 16px;
      font-size: 1em;
      border: none;
      border-radius: 8px;
      width: 100%;
      margin-bottom: 20px;
      background: #f0f0f0;
      color: #333;
      box-sizing: border-box;
    }

    button {
      padding: 12px 24px;
      font-size: 1em;
      border: none;
      border-radius: 8px;
      background-color: #00bcd4;
      color: white;
      cursor: pointer;
      transition: background-color 0.3s ease;
      width: 100%;
    }

    button:hover {
      background-color: #0191a8;
    }

    @media (max-width: 500px) {
      h1 {
        font-size: 1.5em;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Join a Video Call</h1>
    <input type="text" id="roomInput" placeholder="Enter Room Code" />
    <button onclick="joinRoom()">Join</button>
  </div>

  <script>
    function joinRoom() {
      const room = document.getElementById('roomInput').value.trim();
      if (room) {
        window.location.href = `index.html?room=${room}`;
      }
    }
  </script>
</body>
</html>
